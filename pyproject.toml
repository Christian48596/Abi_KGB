[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abi-kgb"
version = "1.0.0"
description = "Portable hardware-, scheduler-, MPI-, and memory-aware advisor for ABINIT paral_kgb layouts"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Christian Tantardini"}
]
keywords = ["ABINIT", "HPC", "MPI", "SLURM", "PBS", "DFT", "parallelization", "KGB"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Christian48596/Abi_KGB"
Repository = "https://github.com/Christian48596/Abi_KGB"
Issues = "https://github.com/Christian48596/Abi_KGB/issues"
Documentation = "https://github.com/Christian48596/Abi_KGB#readme"

[project.scripts]
abi-kgb = "abi_kgb.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["abi_kgb*"]
